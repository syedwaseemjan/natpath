name: publish

on:
  release:
    types: [published]

jobs:
  pypi:
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/natpath/
    permissions:
      id-token: write
      attestations: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[dev]" build
      - name: Lint
        run: ruff check src tests && ruff format --check src tests
      - name: Typecheck
        run: mypy
      - name: Test
        run: pytest
      - name: Check the release tag matches the package version
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          init=$(python -c "import pathlib, re; text = pathlib.Path('src/natpath/__init__.py').read_text(); print(re.search(r'__version__ = \"([^\"]+)\"', text).group(1))")
          tag="${{ github.event.release.tag_name }}"
          if [ "$init" != "$version" ]; then
            echo "__version__ is $init but pyproject.toml is $version"
            exit 1
          fi
          if [ "$tag" != "v$version" ]; then
            echo "Release tag $tag does not match package version v$version"
            exit 1
          fi
      - name: Build
        run: python -m build
      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
